<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dino Runner</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Courier New', monospace;
  }
  #wrap {
    text-align: center;
  }
  canvas {
    border-bottom: 2px solid #535353;
    background: #fff;
    image-rendering: pixelated;
  }
  #hud {
    display: flex;
    justify-content: space-between;
    width: 600px;
    margin: 0 auto 4px auto;
    font-size: 14px;
    color: #535353;
    letter-spacing: 1px;
  }
  #msg {
    font-size: 14px;
    color: #535353;
    margin-top: 8px;
    height: 20px;
  }
  #gapbar-wrap {
    width: 600px;
    margin: 0 auto;
    height: 6px;
    background: #eee;
    border: 1px solid #535353;
  }
  #gapbar {
    height: 100%;
    background: #535353;
    width: 100%;
    transition: width 0.1s linear, background 0.2s linear;
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="hud">
    <span id="level">LEVEL 001 / 300</span>
    <span id="score">HI 00000 00000</span>
  </div>
  <canvas id="game" width="600" height="150"></canvas>
  <div id="gapbar-wrap"><div id="gapbar"></div></div>
  <div id="msg">Press SPACE or tap to start</div>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const levelEl = document.getElementById('level');
const msgEl = document.getElementById('msg');
const gapbarEl = document.getElementById('gapbar');

const GROUND_Y = 130;
const GRAVITY = 0.6;
const JUMP_VELOCITY = -10.5;
const DUCK_HEIGHT = 20;
const MAX_LEVEL = 300;
const POINTS_PER_LEVEL = 35;
const MAX_GAP = 320;
const START_GAP = 260;

let gameSpeed = 6;
let score = 0;
let hiScore = 0;
let frame = 0;
let isGameOver = false;
let isStarted = false;
let isVictory = false;
let obstacles = [];
let clouds = [];

let level = 1;
let chaserGap = START_GAP;
let invulnFrames = 0;
let gameOverReason = '';

// ---- Dino ----
const dino = {
  x: 40,
  y: GROUND_Y - 40,
  width: 40,
  height: 40,
  vy: 0,
  isJumping: false,
  isDucking: false,
  legFrame: 0
};

function resetGame() {
  score = 0;
  gameSpeed = 6;
  frame = 0;
  obstacles = [];
  clouds = [];
  dino.y = GROUND_Y - 40;
  dino.vy = 0;
  dino.isJumping = false;
  dino.isDucking = false;
  isGameOver = false;
  isVictory = false;
  isStarted = true;
  level = 1;
  chaserGap = START_GAP;
  invulnFrames = 0;
  gameOverReason = '';
  msgEl.textContent = '';
}

function jump() {
  if (!isStarted) {
    resetGame();
    return;
  }
  if (isGameOver || isVictory) {
    resetGame();
    return;
  }
  if (!dino.isJumping) {
    dino.vy = JUMP_VELOCITY;
    dino.isJumping = true;
  }
}

function setDuck(state) {
  if (!dino.isJumping) {
    dino.isDucking = state;
    dino.height = state ? DUCK_HEIGHT : 40;
    dino.y = state ? GROUND_Y - DUCK_HEIGHT : GROUND_Y - 40;
  }
}

// ---- Input ----
document.addEventListener('keydown', (e) => {
  if (e.code === 'Space' || e.code === 'ArrowUp') {
    e.preventDefault();
    jump();
  }
  if (e.code === 'ArrowDown') {
    e.preventDefault();
    setDuck(true);
  }
});
document.addEventListener('keyup', (e) => {
  if (e.code === 'ArrowDown') {
    setDuck(false);
  }
});
canvas.addEventListener('mousedown', jump);
canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  jump();
});

// ---- Obstacles ----
function spawnObstacle() {
  const isBird = level > 5 && Math.random() < 0.25 + level * 0.0005;
  if (isBird) {
    const heights = [GROUND_Y - 65, GROUND_Y - 40, GROUND_Y - 15];
    obstacles.push({
      type: 'bird',
      x: canvas.width,
      y: heights[Math.floor(Math.random() * heights.length)],
      width: 34,
      height: 24,
      wingFrame: 0,
      passed: false
    });
  } else {
    const size = 15 + Math.random() * 20;
    const cluster = 1 + Math.floor(Math.random() * Math.min(3, 1 + Math.floor(level / 40)));
    for (let i = 0; i < cluster; i++) {
      obstacles.push({
        type: 'cactus',
        x: canvas.width + i * (size + 6),
        y: GROUND_Y - size,
        width: size * 0.6,
        height: size,
        passed: false
      });
    }
  }
}

function spawnCloud() {
  clouds.push({
    x: canvas.width,
    y: 20 + Math.random() * 40,
    width: 46
  });
}

// ---- Collision ----
function collides(a, b) {
  const pad = 4;
  return (
    a.x + pad < b.x + b.width - pad &&
    a.x + a.width - pad > b.x + pad &&
    a.y + pad < b.y + b.height - pad &&
    a.y + a.height - pad > b.y + pad
  );
}

// ---- Drawing ----
function drawGround() {
  ctx.strokeStyle = '#535353';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, GROUND_Y);
  ctx.lineTo(canvas.width, GROUND_Y);
  ctx.stroke();

  ctx.fillStyle = '#535353';
  const dashLen = 20;
  const gap = 15;
  const total = dashLen + gap;
  const offset = (frame * gameSpeed) % total;
  for (let x = -offset; x < canvas.width; x += total) {
    ctx.fillRect(x, GROUND_Y + 4, dashLen, 2);
  }
}

function drawClouds() {
  ctx.fillStyle = '#c8c8c8';
  clouds.forEach(c => {
    ctx.fillRect(c.x, c.y, c.width, 6);
    ctx.fillRect(c.x + 6, c.y - 4, c.width - 20, 6);
  });
}

function drawDino() {
  const flashOff = invulnFrames > 0 && Math.floor(invulnFrames / 4) % 2 === 0;
  if (flashOff) return; // flicker while invulnerable
  ctx.fillStyle = '#535353';
  const x = dino.x, y = dino.y, w = dino.width, h = dino.height;

  if (dino.isDucking) {
    ctx.fillRect(x, y + h - 16, w + 10, 16);
    ctx.fillRect(x + w - 6, y + h - 22, 12, 8);
    const legOffset = dino.legFrame < 10 ? 0 : 4;
    ctx.fillRect(x + 4 + legOffset, y + h, 6, 6);
    ctx.fillRect(x + w - 4 - legOffset, y + h, 6, 6);
    return;
  }

  ctx.fillRect(x + 8, y, w - 16, h - 10);
  ctx.fillRect(x + w - 20, y - 8, 20, 18);
  ctx.fillStyle = '#fff';
  ctx.fillRect(x + w - 7, y - 4, 4, 4);
  ctx.fillStyle = '#535353';
  ctx.fillRect(x, y + 4, 10, 8);
  if (dino.isJumping) {
    ctx.fillRect(x + 8, y + h - 10, 8, 12);
    ctx.fillRect(x + w - 18, y + h - 10, 8, 12);
  } else {
    const legOffset = dino.legFrame < 10 ? 0 : 6;
    ctx.fillRect(x + 8 + legOffset, y + h - 10, 8, 12);
    ctx.fillRect(x + w - 18 - legOffset, y + h - 10, 8, 12);
  }
}

function drawObstacles() {
  ctx.fillStyle = '#535353';
  obstacles.forEach(o => {
    if (o.type === 'cactus') {
      ctx.fillRect(o.x, o.y, o.width, o.height);
      ctx.fillRect(o.x - 4, o.y + 6, 4, 8);
      ctx.fillRect(o.x + o.width, o.y + 10, 4, 8);
    } else {
      const flap = o.wingFrame < 15 ? 0 : 10;
      ctx.fillRect(o.x + 8, o.y + 8, 18, 8);
      ctx.fillRect(o.x, o.y + 8 - flap, 10, 4);
      ctx.fillRect(o.x + 24, o.y + 8 - flap, 10, 4);
    }
  });
}

// pixel tree chasing the dino from behind
function drawChaser() {
  const treeX = dino.x - chaserGap;
  if (treeX < -40 || treeX > canvas.width) return; // off-screen, not visible yet

  const danger = 1 - Math.min(1, chaserGap / START_GAP); // 0 (far) -> 1 (close)
  const r = Math.floor(83 + danger * (200 - 83));
  const g = Math.floor(83 - danger * 60);
  const b = Math.floor(60 - danger * 60);
  ctx.fillStyle = `rgb(${r},${Math.max(g,0)},${Math.max(b,0)})`;

  const sway = Math.sin(frame * 0.15) * 2;
  // trunk
  ctx.fillRect(treeX + 12, GROUND_Y - 22, 8, 22);
  // foliage (pixel clusters)
  ctx.fillRect(treeX + sway, GROUND_Y - 44, 32, 12);
  ctx.fillRect(treeX + 4 + sway, GROUND_Y - 54, 24, 12);
  ctx.fillRect(treeX + 8 + sway, GROUND_Y - 62, 16, 10);
  // angry eyes when close
  if (danger > 0.55) {
    ctx.fillStyle = '#ff2b2b';
    ctx.fillRect(treeX + 8, GROUND_Y - 46, 4, 4);
    ctx.fillRect(treeX + 20, GROUND_Y - 46, 4, 4);
  }
}

function drawScore() {
  const s = Math.floor(score).toString().padStart(5, '0');
  const hi = Math.floor(hiScore).toString().padStart(5, '0');
  scoreEl.textContent = `HI ${hi} ${s}`;
  levelEl.textContent = `LEVEL ${String(level).padStart(3, '0')} / ${MAX_LEVEL}`;
}

function updateGapBar() {
  const pct = Math.max(0, Math.min(100, (chaserGap / START_GAP) * 100));
  gapbarEl.style.width = pct + '%';
  if (pct < 20) gapbarEl.style.background = '#d9412e';
  else if (pct < 50) gapbarEl.style.background = '#d97757';
  else gapbarEl.style.background = '#535353';
}

function drawGameOver() {
  ctx.fillStyle = '#535353';
  ctx.font = 'bold 18px monospace';
  ctx.textAlign = 'center';
  ctx.fillText(gameOverReason || 'G A M E   O V E R', canvas.width / 2, 55);
  ctx.font = '13px monospace';
  ctx.fillText(`Reached level ${level} / ${MAX_LEVEL}`, canvas.width / 2, 78);
  ctx.fillText('Press SPACE to restart', canvas.width / 2, 98);
  ctx.textAlign = 'left';
}

function drawVictory() {
  ctx.fillStyle = '#535353';
  ctx.font = 'bold 18px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('YOU BEAT ALL 300 LEVELS!', canvas.width / 2, 55);
  ctx.font = '13px monospace';
  ctx.fillText('The tree finally gives up chasing.', canvas.width / 2, 78);
  ctx.fillText('Press SPACE to play again', canvas.width / 2, 98);
  ctx.textAlign = 'left';
}

// ---- Update ----
function update() {
  frame++;

  // dino physics
  if (dino.isJumping) {
    dino.vy += GRAVITY;
    dino.y += dino.vy;
    if (dino.y >= GROUND_Y - dino.height) {
      dino.y = GROUND_Y - dino.height;
      dino.isJumping = false;
      dino.vy = 0;
    }
  }
  dino.legFrame = (dino.legFrame + 1) % 20;
  if (invulnFrames > 0) invulnFrames--;

  // level progression
  const newLevel = Math.min(MAX_LEVEL, 1 + Math.floor(score / POINTS_PER_LEVEL));
  if (newLevel !== level) {
    level = newLevel;
    if (level >= MAX_LEVEL) {
      isVictory = true;
      isStarted = false;
      if (score > hiScore) hiScore = score;
      return;
    }
  }

  // difficulty scaling with level
  gameSpeed = 6 + level * 0.045;
  const chaserCatchRate = 0.012 + level * 0.0035;
  const spawnInterval = Math.max(18, 45 - Math.floor(level / 6));

  // obstacles
  if (frame % spawnInterval === 0) {
    if (obstacles.length === 0 || canvas.width - obstacles[obstacles.length - 1].x > 130) {
      spawnObstacle();
    }
  }
  obstacles.forEach(o => {
    o.x -= gameSpeed;
    if (o.wingFrame !== undefined) o.wingFrame = (o.wingFrame + 1) % 30;
    if (!o.passed && o.x + o.width < dino.x) {
      o.passed = true;
      chaserGap = Math.min(MAX_GAP, chaserGap + 6); // reward for clean dodge
    }
  });
  obstacles = obstacles.filter(o => o.x + o.width > 0);

  // clouds
  if (frame % 120 === 0) spawnCloud();
  clouds.forEach(c => c.x -= gameSpeed * 0.4);
  clouds = clouds.filter(c => c.x + c.width > 0);

  // obstacle collisions (stumble, not instant death)
  if (invulnFrames <= 0) {
    const dinoBox = { x: dino.x, y: dino.y, width: dino.width, height: dino.height };
    for (const o of obstacles) {
      const oBox = { x: o.x, y: o.y, width: o.width, height: o.height };
      if (collides(dinoBox, oBox)) {
        chaserGap -= 110;
        invulnFrames = 45;
        break;
      }
    }
  }

  // chaser passively closes the gap, faster at higher levels
  chaserGap -= chaserCatchRate;

  if (chaserGap <= 0) {
    isGameOver = true;
    gameOverReason = 'THE TREE TAGGED YOU!';
    if (score > hiScore) hiScore = score;
    msgEl.textContent = 'Press SPACE or tap to restart';
  }

  // score
  score += 0.15;
}

// ---- Main loop ----
function loop() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  drawClouds();
  drawGround();
  drawChaser();
  drawDino();
  drawObstacles();
  drawScore();
  updateGapBar();

  if (!isStarted && isVictory) {
    drawVictory();
  } else if (!isStarted) {
    // idle, waiting to start
  } else if (isGameOver) {
    drawGameOver();
  } else {
    update();
  }

  requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
